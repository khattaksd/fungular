<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>fungular</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="fungular — a neutral Angular 22 monorepo playground."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Inter is self-hosted from fonts/ (relative, so a sub-path host works): no
         third-party domain in the critical rendering path. Preload the two weights
         used above the fold. -->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link
      rel="preload"
      href="fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/inter-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
