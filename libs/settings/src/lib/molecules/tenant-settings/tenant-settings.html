@if (logo(); as logoUrl) {
<div class="flex items-center gap-4">
  <img [src]="logoUrl" [alt]="name()" class="h-12 w-12 rounded-xl" />
  <div>
    <p class="font-semibold text-neutral-900">{{ name() }}</p>
    <p class="text-sm text-neutral-500">{{ domain() }}</p>
  </div>
</div>
}

<form
  (ngSubmit)="save()"
  class="mt-4 space-y-4"
  [attr.aria-label]="'SETTINGS.TENANT_NAME' | translate"
>
  <label class="block">
    <span class="text-sm font-semibold text-neutral-900">{{
      'SETTINGS.TENANT_NAME' | translate
    }}</span>
    <input
      type="text"
      [(ngModel)]="name"
      name="tenantName"
      [attr.aria-label]="'SETTINGS.TENANT_NAME' | translate"
      class="mt-1 w-full max-w-sm rounded-xl border border-neutral-300 px-3 py-2 text-neutral-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900"
    />
  </label>

  <div class="flex flex-wrap items-center gap-3">
    <button libButton type="submit" [disabled]="!name().trim() || saving()">
      {{ (saving() ? 'SETTINGS.SAVING' : 'SETTINGS.SAVE') | translate }}
    </button>
    <button
      type="button"
      libButton
      variant="outline"
      (click)="uploadLogo()"
    >
      {{ 'SETTINGS.UPLOAD_LOGO' | translate }}
    </button>
  </div>

  @if (saved()) {
  <p class="text-sm font-medium text-green-600">{{ 'SETTINGS.SAVED' | translate }}</p>
  }
  @if (error(); as message) {
  <p role="alert" class="text-sm font-medium text-red-600">{{ message.message }}</p>
  }
</form>
