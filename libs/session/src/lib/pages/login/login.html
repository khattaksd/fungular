<main class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16">
  <img
    src="./assets/logo.svg"
    alt="fungular"
    class="h-16 w-16 rounded-2xl"
    aria-hidden="true"
  />
  <h1 class="mt-6 text-3xl font-bold tracking-tight text-neutral-900">
    {{ 'AUTH.SIGN_IN' | translate }}
  </h1>
  <p class="mt-2 text-neutral-600">
    {{ 'AUTH.SIGN_IN_HINT' | translate }}
  </p>

  <form (ngSubmit)="onSubmit()" class="mt-8 space-y-4">
    <label class="block">
      <span class="text-sm font-semibold text-neutral-900">{{
        'AUTH.EMAIL' | translate
      }}</span>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        [attr.aria-label]="'AUTH.EMAIL' | translate"
        class="mt-1 w-full rounded-xl border border-neutral-300 px-3 py-2.5 text-neutral-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900"
      />
    </label>

    <label class="block">
      <span class="text-sm font-semibold text-neutral-900">{{
        'AUTH.PASSWORD' | translate
      }}</span>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
        [attr.aria-label]="'AUTH.PASSWORD' | translate"
        class="mt-1 w-full rounded-xl border border-neutral-300 px-3 py-2.5 text-neutral-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900"
      />
    </label>

    @if (errorMessage(); as message) {
    <p role="alert" class="text-sm font-medium text-red-600">{{ message }}</p>
    }

    <button
      libButton
      type="submit"
      size="lg"
      [disabled]="loading() || !email.includes('@') || !password"
      class="w-full"
    >
      {{ (loading() ? 'AUTH.SIGNING_IN' : 'AUTH.CONTINUE') | translate }}
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-neutral-500">
    {{ 'AUTH.DEMO_HINT' | translate }}
  </p>
</main>
