<main class="mx-auto max-w-2xl px-4 py-16">
  <h1 class="text-3xl font-bold tracking-tight text-neutral-900">
    {{ 'AUTH.CHOOSE_WORKSPACE' | translate }}
  </h1>
  <p class="mt-2 text-neutral-600">
    {{ 'AUTH.CHOOSE_WORKSPACE_HINT' | translate }}
  </p>

  <ul class="mt-8 space-y-3">
    @for (tenant of tenants(); track tenant.id) {
    <li>
      <button
        type="button"
        (click)="choose(tenant.id)"
        class="flex w-full items-center gap-4 rounded-2xl border border-neutral-200 bg-white p-4 text-left transition-colors hover:bg-neutral-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900"
      >
        <img
          [src]="tenant.logo"
          [alt]="tenant.name"
          class="h-10 w-10 rounded-lg"
        />
        <span class="flex-1">
          <span class="block font-semibold text-neutral-900">{{
            tenant.name
          }}</span>
          <span class="block text-sm text-neutral-500">{{ tenant.role }}</span>
        </span>
        <span aria-hidden="true" class="text-neutral-400">→</span>
      </button>
    </li>
    }
  </ul>

  <button
    type="button"
    (click)="logout()"
    class="mt-8 text-sm font-semibold text-neutral-500 hover:text-neutral-900"
  >
    {{ 'AUTH.SIGN_OUT' | translate }}
  </button>
</main>
