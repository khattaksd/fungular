name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# A second push to the same PR makes the first run irrelevant. Cancelling it frees
# a runner instead of paying for an answer nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # Task distribution via Nx Cloud. Run before dependencies are installed.
      # https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: actions/setup-node@v7
        with:
          # Same version as local development; `engines` in package.json sets the floor.
          node-version-file: .nvmrc

      - name: Find the npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      # Pull requests only read this cache; main writes it, so PRs stop adding a ~200 MB copy each.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ github.job }}-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Save the npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # No secrets here on purpose: this job proves that a fresh clone, with no
      # integrations configured, still lints, tests and builds.
      # One invocation per target on purpose: `--coverage` only exists on the
      # unit-test builder and
      # `--configuration=production` only exists on build. Nx forwards extra args to
      # every target in a `run-many`, so a single combined command makes eslint fail
      # with "Invalid option '--coverage'" and build with "'coverage' is not found in
      # schema" — failures that look like lint errors but are only bad plumbing.
      - name: Lint
        run: npx nx run-many -t lint

      - name: Test with coverage
        if: always()
        run: npx nx run-many -t test --coverage

      - name: Build
        if: always()
        run: npx nx run-many -t build --configuration=production

      # A broken story should fail the PR, not the deploy after merge.
      - name: Build Storybook
        if: always()
        run: npx nx build-storybook ui

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - run: npx nx fix-ci
        if: always()

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tag must match the @playwright/test version in package-lock.json, because the image ships that version's browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # The container user differs from the checkout owner, which makes git refuse the repo and breaks `nx affected`.
      - name: Trust the workspace in git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Find the npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ github.job }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ github.job }}-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Save the npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      # Gives `nx affected` the merge-base of the PR as its base.
      - uses: nrwl/nx-set-shas@v5.1.0

      # Pushes to main always run e2e; pull requests run it only when Nx says an e2e project is affected.
      - name: Check whether e2e is affected
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "$(npx nx show projects --affected -t e2e --json 2>/dev/null)" != "[]" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No e2e project is affected by this change; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only chromium: the firefox/webkit matrix belongs on a nightly schedule, not
      # in front of every pull request. `mobile-chrome` drives the same chromium
      # binary through the Pixel 5 descriptor, and it is the only project that
      # exercises the header's burger-menu path.
      #
      # The `--` matters. Without it Nx swallows `--project` as its own flag and
      # never forwards it, so Playwright runs all four projects and the two whose
      # browsers were not used fail.
      - name: Run end-to-end tests
        if: steps.affected.outputs.run == 'true'
        run: npx nx e2e demo-app -- --project=chromium --project=mobile-chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright/
          retention-days: 7
